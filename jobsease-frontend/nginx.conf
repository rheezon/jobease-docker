map $time_iso8601 $log_date {
    "~^(?<ymd>\\d{4}-\\d{2}-\\d{2})" $ymd;
    default "unknown-date";
}

server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Daily access logs (mounted to host via docker-compose volume)
    access_log /var/log/nginx/access-$log_date.log;
    error_log /var/log/nginx/error.log warn;

    # Gzip for common static types
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers for Google Sign-In
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Embedder-Policy "unsafe-none" always;
    
    # CORS headers (if needed for API calls)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization" always;

    # Prevent caching of index.html - always serve fresh for SPA routing
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # Cache busting for assets
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # SPA fallback to index.html for client-side routing
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri /index.html;
    }
}

